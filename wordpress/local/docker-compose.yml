# Local WordPress for editing the Ummah Builders site and exporting it as a static site.
# Start:  docker compose up -d      (from this folder)   ->  http://localhost:8080
name: ummahbuilders-wp

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-local-only
      MARIADB_ROOT_PASSWORD: wp-local-only-root
    volumes:
      - dbdata:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on: [db]
    # Apache listens on 8080 inside the container too, so WordPress can reach its own
    # URL (http://localhost:8080) - Simply Static needs that to crawl the site.
    ports: ["127.0.0.1:8080:8080"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local-only
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
      - ./apache-8080.conf:/etc/apache2/sites-enabled/ub-8080.conf:ro
      - ../ummah-builders-theme:/var/www/html/wp-content/themes/ummah-builders
      - ./export:/var/www/export

  # WP-CLI, run on demand:  docker compose run --rm cli <command>
  cli:
    image: wordpress:cli-php8.2
    profiles: ["cli"]
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-local-only
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
      - ../ummah-builders-theme:/var/www/html/wp-content/themes/ummah-builders
      - ../templates:/templates:ro
      - ../tools:/tools:ro
      - ./export:/var/www/export
    entrypoint: ["wp"]

volumes:
  wpdata:
  dbdata:
